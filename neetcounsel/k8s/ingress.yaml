apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neetcounsel-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: neetcounsel.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: neetcounsel     # Replace with your service name
            port:
              number: 8080        # Replace with your app's service port
